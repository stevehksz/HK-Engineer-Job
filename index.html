<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>香港工程師 · 考牌｜求職｜留學</title>
<meta name="description" content="香港工程師考牌（MHKIE / CEng / RPE）路徑指引、學歷認證、香港求職指南、CV 體檢。">
<style>
  html,body{margin:0;padding:0;background:#f6f9fc}
  body{font-family:-apple-system,BlinkMacSystemFont,"PingFang HK","Microsoft JhengHei",sans-serif;color:#1b2b3a}
  #site{position:fixed;inset:0;width:100%;height:100%;border:0;display:block;background:#f6f9fc}
  #boot{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#10365c;background:#f6f9fc;z-index:50}
  .sp{width:34px;height:34px;border:3px solid #d7e2ee;border-top-color:#10365c;border-radius:50%;animation:r .9s linear infinite}
  @keyframes r{to{transform:rotate(360deg)}}
  #boot p{margin:0;font-size:14px;color:#5a6b7d}
  #boot a{display:inline-block;margin-top:6px;background:#10365c;color:#fff;font-weight:700;padding:11px 22px;border-radius:30px;text-decoration:none;font-size:14px}
</style>
</head>
<body>
<iframe id="site" src="about:blank" title="香港工程師 · 考牌｜求職｜留學"
        allow="clipboard-write; clipboard-read; fullscreen"
        referrerpolicy="no-referrer" loading="eager"></iframe>
<div id="boot"><div class="sp"></div><p>正在載入…</p></div>



<div id="zoom"><img alt="價目表放大檢視"></div>

<script>
(function () {
  /* v3.54b（2026-11-26）：微信实不再被网关拦截（实测 UA+Origin:github.io+sharecode=200 全站），
     故删除微信静态精简首页，微信与浏览器一视同仁：全屏 iframe 载入主站完整版。 */
  var BASE = 'https://stevehksz.app.workbuddy.host/?sharecode=KCSIXWRVH6';
  var frame = document.getElementById('site');
  var boot = document.getElementById('boot');

  var src = BASE, qs = [];
  try {
    var sp = new URLSearchParams(location.search);
    var pane = sp.get('pane');
    var ref = sp.get('ref');
    if (pane && /^[a-z]{2,12}$/.test(pane)) qs.push('pane=' + encodeURIComponent(pane));
    if (ref && /^[\w-]{1,40}$/.test(ref)) qs.push('ref=' + encodeURIComponent(ref));
  } catch (e) { /* 舊瀏覽器忽略 */ }
  qs.push('_v=' + Date.now());
  src += (src.indexOf('?') > -1 ? '&' : '?') + qs.join('&');

  var done = false;
  frame.addEventListener('load', function () {
    done = true;
    if (boot && boot.parentNode) boot.parentNode.removeChild(boot);
  });

  /* 兜底：4.5 秒仍沒載入 → 頂層跳轉主站（微信極端環境仍能看到全站） */
  setTimeout(function () {
    if (done) return;
    location.replace(src);
  }, 4500);

  frame.src = src;
})();
</script>
</body>
</html>
